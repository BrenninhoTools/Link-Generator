<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
        <div class="text-center space-y-1">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-50 text-blue-600 rounded-xl mb-1">
                <i class="fa-solid fa-link text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Dummy Link Generator</h1>
            <p class="text-xs text-slate-500">Create mock URLs instantly for testing and shareable links</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Custom Keyword / Path</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 rounded-l-xl border border-r-0 border-slate-200 bg-slate-100 text-slate-500 text-xs select-none">
                        https://link.gen/
                    </span>
                    <input type="text" id="customPath" placeholder="my-custom-link" class="w-full px-3 py-2.5 rounded-r-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition text-sm">
                </div>
            </div>

            <button onclick="generateLink()" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                Generate Dummy Link
            </button>
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-3">
            <label class="block text-xs font-semibold uppercase text-slate-500">Generated URL</label>
            
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 min-h-[50px] flex items-center justify-between gap-2">
                <a id="generatedLink" href="#" target="_blank" class="text-sm font-mono text-blue-600 hover:underline break-all">
                    https://link.gen/abc123xyz
                </a>
            </div>

            <div class="flex gap-2">
                <button onclick="copyLink()" class="flex-1 py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy"></i>
                    Copy Link
                </button>
                <a id="openBtn" href="#" target="_blank" class="py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    Open
                </a>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 bg-slate-900 text-white text-xs py-2 px-4 rounded-xl shadow-lg opacity-0 transition-opacity duration-300">
        Copied to clipboard!
    </div>

    <script>
        function generateRandomSlug(length = 8) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateLink() {
            const pathInput = document.getElementById('customPath').value.trim();
            const slug = pathInput ? pathInput.toLowerCase().replace(/[^a-z0-9-_]/g, '-') : generateRandomSlug();
            const dummyUrl = `https://link.gen/${slug}`;

            const linkElem = document.getElementById('generatedLink');
            const openBtn = document.getElementById('openBtn');

            linkElem.innerText = dummyUrl;
            linkElem.href = dummyUrl;
            openBtn.href = dummyUrl;
        }

        function copyLink() {
            const text = document.getElementById('generatedLink').innerText;

            const area = document.createElement('textarea');
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            document.body.removeChild(area);

            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        generateLink();
    </script>
</body>
</html>
